<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="#065F46" stroke="#D97706" stroke-width="4"/>
  <circle cx="100" cy="100" r="91" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="100" cy="100" r="76" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="62" fill="#047857"/>

  <!-- Curved Path for Header Text -->
  <defs>
    <path id="idcpTopArc" d="M 28 100 A 72 72 0 1 1 172 100" fill="none"/>
    <path id="idcpBottomArc" d="M 166 100 A 66 66 0 0 1 34 100" fill="none"/>
  </defs>

  <!-- Text Along Arcs -->
  <text fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="7.5" letter-spacing="0.8">
    <textPath href="#idcpTopArc" startOffset="50%" text-anchor="middle">
      ISLAMIC DA'WAH COUNCIL OF THE PHILS.
    </textPath>
  </text>

  <text fill="#FEF3C7" font-family="Arial, sans-serif" font-weight="900" font-size="8" letter-spacing="1.2">
    <textPath href="#idcpBottomArc" startOffset="50%" text-anchor="middle">
      • HALAL CERTIFIED •
    </textPath>
  </text>

  <!-- Center Halal Calligraphy -->
  <text x="100" y="93" text-anchor="middle" fill="#FFFFFF" font-family="serif" font-weight="bold" font-size="28">حلال</text>
  
  <!-- IDCP Acronym Plaque -->
  <rect x="62" y="103" width="76" height="18" rx="4" fill="#FBBF24" stroke="#B45309" stroke-width="1"/>
  <text x="100" y="116.5" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="2">IDCP</text>

  <!-- Subtitle -->
  <text x="100" y="132" text-anchor="middle" fill="#A7F3D0" font-family="Arial, sans-serif" font-weight="800" font-size="6" letter-spacing="1.5">PHILIPPINES</text>
</svg>