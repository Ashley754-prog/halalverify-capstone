<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer Gold & Green Scalloped Border -->
  <circle cx="100" cy="100" r="96" fill="#047857" stroke="#D97706" stroke-width="4"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="100" cy="100" r="75" fill="#FFFFFF" stroke="#047857" stroke-width="3"/>
  <circle cx="100" cy="100" r="62" fill="#065F46"/>

  <defs>
    <path id="hdipTopArc" d="M 30 100 A 70 70 0 1 1 170 100" fill="none"/>
    <path id="hdipBottomArc" d="M 166 100 A 66 66 0 0 1 34 100" fill="none"/>
  </defs>

  <!-- Outer Ring Text -->
  <text fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="7.5" letter-spacing="0.7">
    <textPath href="#hdipTopArc" startOffset="50%" text-anchor="middle">
      HALAL DEVELOPMENT INSTITUTE
    </textPath>
  </text>

  <text fill="#FEF3C7" font-family="Arial, sans-serif" font-weight="900" font-size="8" letter-spacing="1">
    <textPath href="#hdipBottomArc" startOffset="50%" text-anchor="middle">
      OF THE PHILIPPINES
    </textPath>
  </text>

  <!-- Center Arabic Halal -->
  <text x="100" y="93" text-anchor="middle" fill="#FFFFFF" font-family="serif" font-weight="bold" font-size="28">حلال</text>
  
  <!-- HDIP Plaque -->
  <rect x="62" y="103" width="76" height="18" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="100" y="116.5" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="2">HDIP</text>

  <!-- Star accents -->
  <polygon points="52,100 54,95 59,95 55,92 57,87 52,90 47,87 49,92 45,95 50,95" fill="#FBBF24"/>
  <polygon points="148,100 150,95 155,95 151,92 153,87 148,90 143,87 145,92 141,95 146,95" fill="#FBBF24"/>
</svg>